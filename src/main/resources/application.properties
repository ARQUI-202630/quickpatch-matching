spring.application.name=matching
server.port=8080

# Probes de k3s (Documento de Infraestructura, sección 5.8), con las mismas rutas que los servicios .NET:
# /health/live (el proceso responde) y /health/ready (el servicio y su base de datos están listos).
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.live.include=livenessState
management.endpoint.health.group.ready.include=readinessState,db

# Base de datos propia (ADR-014). El servicio se conecta con matching_app (sin BYPASSRLS, DD 10.2);
# las migraciones corren con el usuario de FLYWAY_USER (el rol _migrator en el pipeline).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_matching}
spring.datasource.username=${DB_USER:matching_app}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.user=${FLYWAY_USER:${DB_USER:matching_app}}
spring.flyway.password=${FLYWAY_PASSWORD:${DB_PASSWORD:}}

# Kafka (ADR-006). El offset se confirma por registro, después de aplicar el evento (ADR-007).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=matching-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Matching (DD 7.5): la oferta vence a los 3 minutos (RN-M8) y un barrido de respaldo reanuda las solicitudes en
# espera que ya tienen candidato (RN-M10). El barrido recorre los tenants con el rol matching_scheduler (P-06).
quickpatch.matching.offer-ttl=${MATCHING_OFFER_TTL:3m}
quickpatch.matching.sweep-interval=${MATCHING_SWEEP_INTERVAL:PT1M}
quickpatch.matching.scheduler-role=${MATCHING_SCHEDULER_ROLE:matching_scheduler}

# Transactional Outbox (ADR-007): el publicador lee los eventos de todos los tenants con matching_outbox.
# Los dos roles los crea db/roles.sql; vacíos, el servicio usa su propio usuario (solo en desarrollo local).
quickpatch.outbox.publisher-role=${OUTBOX_PUBLISHER_ROLE:matching_outbox}
quickpatch.outbox.poll-interval=PT1S

# JWT RS256 de Identity (ADR-018): solo la llave pública; sin ella ningún token es válido (falla cerrado).
quickpatch.jwt.issuer=${JWT_ISSUER:quickpatch-identity}
quickpatch.jwt.audience=${JWT_AUDIENCE:quickpatch}
quickpatch.jwt.public-key-pem=${JWT_PUBLIC_KEY_PEM:}

# Logs JSON en consola con correlationId, tenantId y eventId (MDC), como los servicios .NET.
logging.structured.format.console=${LOG_FORMAT:ecs}
