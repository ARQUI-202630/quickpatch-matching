spring.application.name=matching
server.port=8080

# Probes de k3s (Documento de Infraestructura, sección 5.8), con las mismas rutas que los servicios .NET:
# /health/live (el proceso responde) y /health/ready (el servicio y sus dependencias están listos).
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.live.include=livenessState
management.endpoint.health.group.ready.include=readinessState
