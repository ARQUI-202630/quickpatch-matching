# CI/CD de Matching (Java + Spring Boot).
# El CI vive en este archivo (SCRUM-337). El despliegue (imagen, QA y producción) todavía usa
# los workflows de quickpatch-infrastructure hasta que se traslade (SCRUM-338). Qué corre en cada rama:
#   PR a develop   → lint y pruebas unitarias
#   push develop   → además, pruebas de integración
#   push release/* → además, imagen en GHCR y despliegue en QA (VM2)
#   push main      → la misma imagen de QA, desplegada en producción (VM3)
name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, "release/**", main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI propio del repositorio (SCRUM-337): compilación, pruebas y cobertura ≥ 80%.
  # Las pruebas de integración (*IT, Testcontainers) corren en los push a develop y release/*.
  ci:
    name: Compilación, pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTEGRACION: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Pruebas
        run: |
          if [ "$INTEGRACION" = true ]; then ./mvnw -B -ntp verify; else ./mvnw -B -ntp test jacoco:report; fi

      - name: Cobertura mínima
        run: python3 .github/scripts/cobertura.py jacoco 80 target/site/jacoco/jacoco.xml

  imagen:
    needs: ci
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    uses: ARQUI-202630/quickpatch-infrastructure/.github/workflows/imagen.yml@main

  qa:
    needs: imagen
    if: startsWith(github.ref, 'refs/heads/release/') && needs.imagen.outputs.imagen != ''
    uses: ARQUI-202630/quickpatch-infrastructure/.github/workflows/deploy-k3s.yml@main
    with:
      ambiente: qa
      imagen: ${{ needs.imagen.outputs.imagen }}

  produccion:
    needs: imagen
    if: github.ref == 'refs/heads/main' && needs.imagen.outputs.imagen != ''
    uses: ARQUI-202630/quickpatch-infrastructure/.github/workflows/deploy-k3s.yml@main
    with:
      ambiente: produccion
      imagen: ${{ needs.imagen.outputs.imagen }}

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: ARQUI-202630/quickpatch-infrastructure/.github/workflows/dependency-review.yml@main

  quality-gate:
    name: quality-gate
    if: always()
    needs: [ci, dependency-review]
    runs-on: ubuntu-latest

    steps:
      - name: Validar compuertas
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DEP_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$CI_RESULT" = "success"
          test "$DEP_RESULT" = "success" || test "$DEP_RESULT" = "skipped"
